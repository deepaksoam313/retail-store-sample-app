{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "carts.fullname" . }}
  labels:
    {{- include "carts.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "carts.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode }}  # "Off" = recommendation only, no restarts
  resourcePolicy:
    containerPolicies:
    - containerName: carts
      minAllowed:
        cpu: 100m
        memory: 256Mi
      maxAllowed:
        cpu: 2000m
        memory: 2Gi
      controlledResources:
        - cpu
        - memory
{{- end }}
