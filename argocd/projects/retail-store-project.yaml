apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: retail-store
  namespace: argocd
spec:
  description: Retail Store Sample Application

  sourceRepos:
    - 'https://github.com/deepaksoam313/retail-store-sample-app'
    # UPDATE 1: Allow the Grafana Helm repo so Loki can be downloaded
    - 'https://grafana.github.io/helm-charts'

  destinations:
    - namespace: retail-store
      server: https://kubernetes.default.svc
    # UPDATE 2: Allow the monitoring namespace so Loki has a place to live
    - namespace: monitoring
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    # UPDATE 3: Allow all groups/kinds at the cluster level.
    # Loki and Promtail need this to create Roles that read logs across all nodes.
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    # UPDATE 4: Allow all groups/kinds within namespaces.
    # This is simpler and prevents "Resource not found" errors for PDBs or new APIs.
    - group: '*'
      kind: '*'